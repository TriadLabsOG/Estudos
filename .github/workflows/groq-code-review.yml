name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          # Pega a diferença entre a branch atual e a branch de destino
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          # Verifica se o diff não está vazio
          if [ ! -s pr_diff.txt ]; then
            echo "Nenhuma alteração de código detectada."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff.trim()) return;

            // Usando o modelo Llama 3 70b que é excelente para código e roda rápido no Groq
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama3-70b-8192',
                messages: [
                  {
                    role: 'system',
                    content: 'Você é um sênior focado em code review. Analise o git diff fornecido e aponte bugs, problemas de performance, melhorias de legibilidade ou falhas de segurança. Seja direto, claro e formate a resposta em Markdown (pt-BR). Se o código estiver excelente, elogie brevemente.'
                  },
                  {
                    role: 'user',
                    content: `Aqui está o diff do Pull Request:\n\n${diff}`
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
