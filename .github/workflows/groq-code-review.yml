name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]

  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Commits and Isolated Diffs
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_REF="${{ github.base_ref }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
            BASE_REF=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi

          echo "Comparando contra a branch base: $BASE_REF"

          git fetch origin $BASE_REF

          echo "=== INÍCIO DO HISTÓRICO DE COMMITS ===" > pr_structured_history.txt

          COMMIT_HASHES=$(git log origin/$BASE_REF..HEAD --reverse --format="%H")

          if [ -z "$COMMIT_HASHES" ]; then
            echo "Nenhum commit detectado." > review_result.md
            exit 0
          fi

          for hash in $COMMIT_HASHES; do
            echo "----------------------------------------" >> pr_structured_history.txt
            echo "📌 HASH_COMMIT: $hash" >> pr_structured_history.txt
            echo "📝 MENSAGEM: $(git log -1 --format="%s" $hash)" >> pr_structured_history.txt
            echo "💻 ALTERAÇÕES DESTE COMMIT:" >> pr_structured_history.txt
            git show --format="" --patch $hash >> pr_structured_history.txt
            echo "----------------------------------------" >> pr_structured_history.txt
          done

          echo "=== FIM DO HISTÓRICO ===" >> pr_structured_history.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            if (!fs.existsSync('pr_structured_history.txt')) {
              console.log('Arquivo de histórico não encontrado.');
              return;
            }

            const history = fs.readFileSync('pr_structured_history.txt', 'utf8');

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                  {
                    role: 'system',
                    content: 'Análise de código focada em mentoria empática e ultra-específica para Gabriel, Lucas e Thais.\n\nREGRAS DE CONTEÚDO:\n1. NÃO misture os commits. Analise cada um separadamente na ordem enviada.\n2. Para novos conceitos, use apenas dicas curtas entre parênteses, ex: "(Poderia usar um dicionário aqui)".\n3. Seja direto e evite enrolações teóricas.\n4. NÃO escreva dicas genéricas no final do PR.\n5. NÃO repita sugestões iguais entre commits.\n6. O separador "---" deve existir APENAS ENTRE commits.\n7. NÃO use "---" depois do veredito geral.\n8. O veredito geral deve ter no máximo 5 linhas.\n9. Não invente melhorias irrelevantes apenas para preencher review.\n\nESCALA DE NOTAS VALIDA (0 a 5 tipo uber, além disso tem que ter emoji de estrela):\n- Nota 5: Perfeito/Aprovado (sem retoques).\n- Nota 4 ou 3: Muito Bom/Aprovado (detalhes bobos de formatação ou estilo, não mudam a lógica).\n- Nota 2 ou 1: Erros Importantes (lógica confusa ou comportamento errado que você recomenda ajustar antes do merge).\n- Nota 0: Crítico (código quebrou ou está completamente fora do proposto).\n\nESTRUTURA OBRIGATÓRIA DA RESPOSTA (Markdown pt-BR):\n\n### 📌 Commit: `[Mensagem Original]`\n- **Mensagem de Commit:** avaliação curta.\n- **Análise do Código:**\n  - **Onde:** linha, variável ou arquivo.\n  - **Feedback:** objetivo e específico.\n  - **Como ficaria:**\n```codigo\npequeno trecho aqui\n```\n- **Nota do Commit e Significado Prático:** nota + impacto real.\n\n---\n\n### 📊 Veredito Geral do Pull Request\n- **Status Final:** Aprovado ou Reprovado.\n- **Nota Geral do PR:** média final com justificativa curta.\n- Máximo 5 linhas no veredito geral.'
                  },
                  {
                    role: 'user',
                    content: `Aqui estão os commits e os respectivos códigos isolados enviados no Pull Request:\n\n${history}`
                  }
                ],
                temperature: 0.2
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              console.error('Erro HTTP:', errorText);
              process.exit(1);
            }

            const data = await response.json();

            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
              console.log('Review gerada com sucesso.');
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }

          run().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success() && hashFiles('review_result.md') != ''
        with:
          filePath: review_result.md
          pr_number: ${{ github.event.issue.number }}
