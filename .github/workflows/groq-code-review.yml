name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# Força o runner do GitHub a executar todas as Actions internas diretamente no Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    # Só roda se for um evento de PR normal OU se for um comentário dentro de um PR contendo "/review"
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')
    
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se for por comentário, precisamos de um passo extra para clonar a branch correta do PR
      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Diff and Commits
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necessário para rodar comandos do GitHub CLI
        run: |
          # Descobre a branch de destino baseando-se no evento
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
          else
            # No evento de comentário, usa o CLI do GitHub para descobrir a branch base
            BASE_REF=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi
          
          echo "Comparando contra a branch base: $BASE_REF"
          git fetch origin $BASE_REF
          
          # Captura as alterações de código (Diff)
          git diff origin/$BASE_REF...HEAD > pr_diff.txt
          
          # Captura as mensagens de commit feitas nesta branch
          git log origin/$BASE_REF...HEAD --oneline > pr_commits.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "Nenhuma alteração de código detectada."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff.trim()) return;

            // Lendo os commits capturados, se existirem
            const commits = fs.existsSync('pr_commits.txt') ? fs.readFileSync('pr_commits.txt', 'utf8') : 'Nenhum commit encontrado.';

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                  {
                    role: 'system',
                    content: 'Você é um desenvolvedor sênior atuando como um mentor de código empático, prático e focado no ensino para Gabriel (droppxr), Lucas (Lucaspierre) e Thais.\n\nNão faça introduções longas ou explicações teóricas genéricas (não explique o que é PEP 8 ou Conventional Commits de forma abstrata). Vá direto ao ponto, analisando exclusivamente o que foi enviado e indicando onde mudar.\n\nSua estrutura de resposta DEVE ser estritamente a seguinte:\n\n### 📝 Análise de Commits\n(Liste apenas os commits reais enviados que estão fora do padrão Conventional Commits, mostrando como deveriam ter sido escritos com base na alteração que eles fizeram. Se todos estiverem corretos, faça apenas um elogio curto).\n\n### 💻 Análise de Código\nPara cada arquivo modificado no diff, crie uma subseção com o nome do arquivo (ex: `## nome_do_arquivo.py`) e liste diretamente os pontos de ajuste reais (PEP 8, lógica ou redundâncias) usando exatamente a estrutura abaixo para cada item:\n- **Onde:** Indique a variável, linha ou bloco afetado do código deles.\n- **O que mudar:** Explique de forma simples o ajuste necessário e o motivo.\n- **Sugestão prática:** Mostre o bloco de código deles corrigido.\n\nMantenha o tom encorajador, humanizado e construtivo, focado inteiramente em melhorias reais no código que eles escreveram, sem inventar exemplos fictícios.'
                  },
                  {
                    role: 'user',
                    content: `Aqui estão os dados do Pull Request para análise:\n\n### Mensagens de Commit enviadas:\n\`\`\`\n${commits}\n\`\`\`\n\n### Git Diff do Código:\n\`\`\`diff\n${diff}\n\`\`\``
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
          pr_number: ${{ github.event.issue.number }}
