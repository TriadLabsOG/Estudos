name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Só roda se for um evento de PR normal OU se for um comentário dentro de um PR contendo "/review"
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')
    
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se for por comentário, precisamos de um passo extra para clonar a branch correta do PR
      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necessário para rodar comandos do GitHub CLI
        run: |
          # Descobre a branch de destino baseando-se no evento
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
          else
            # No evento de comentário, usa o CLI do GitHub para descobrir a branch base
            BASE_REF=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi
          
          echo "Comparando contra a branch base: $BASE_REF"
          git fetch origin $BASE_REF
          git diff origin/$BASE_REF...HEAD > pr_diff.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "Nenhuma alteração de código detectada."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff.trim()) return;

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama3-70b-8192',
                messages: [
                  {
                    role: 'system',
                    content: 'Você é um sênior focado em code review. Analise o git diff fornecido e aponte bugs, problemas de performance, melhorias de legibilidade ou falhas de segurança. Seja direto, claro e formate a resposta em Markdown (pt-BR). Se o código estiver excelente, elogie brevemente.'
                  },
                  {
                    role: 'user',
                    content: `Aqui está o diff do Pull Request:\n\n${diff}`
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
          pr_number: ${{ github.event.issue.number }}
