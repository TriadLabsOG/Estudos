name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')
    
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Diff and Commits
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_REF="${{ github.base_ref }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
            BASE_REF=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi
          
          echo "Comparando contra a branch base: $BASE_REF"
          git fetch origin $BASE_REF
          
          git diff origin/$BASE_REF...HEAD > pr_diff.txt
          gh pr view $PR_NUMBER --repo ${{ github.repository }} --json commits -q '.commits[].messageHeadline' > pr_commits.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "Nenhuma alteração de código detectada."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff.trim()) return;

            const commits = fs.existsSync('pr_commits.txt') ? fs.readFileSync('pr_commits.txt', 'utf8') : 'Nenhum commit encontrado.';

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                  {
                    role: 'system',
                    content: 'Você é um mentor de código empático e prático para Gabriel (droppxr), Lucas (Lucaspierre) e Thais, que estão aprendendo a programar do zero.\n\nREGRAS CRÍTICAS E INQUEBRÁVEIS:\n1. NÃO reescreva o código inteiro deles. Foque em feedbacks cirúrgicos e pontuais.\n2. VOCÊ PODE sugerir conceitos novos ou mais avançados (como funções `def`, `try/except`, etc.), mas NÃO reconstrua o código usando isso. Apenas cite a melhoria de forma curta entre parênteses para plantar a semente do conhecimento. Exemplo: "(Poderia usar uma função ao invés disso)" ou "(Aqui caberia um tratamento com try/except)".\n3. Seja direto ao ponto, sem introduções longas ou explicações conceituais genéricas.\n\nESTRUTURA OBRIGATÓRIA DA RESPOSTA (Siga estritamente, em Markdown pt-BR):\n\n### 📝 Análise de Commits\nListe apenas os commits reais enviados que estão fora do padrão Conventional Commits (ignore merges). Mostre de forma curta como corrigir.\n\n### 💻 Análise de Código\nPara cada arquivo modificado, use exatamente esta estrutura por item:\n- **Onde:** Linha ou variável afetada.\n- **Feedback:** O que pode melhorar e o motivo (se couber um conceito novo, use a dica curta entre parênteses).\n- **Como ficaria:** Mostre apenas o trecho pequeno com a sugestão aplicada.\n\n### 📊 Veredito Final e Nota\nCom base no nível de aprendizado deles, avalie se o código está aprovado ou se os erros encontrados são muito impactantes e precisam ser alterados antes do merge.\nForneça uma nota de 0 a 5 seguindo RIGOROSAMENTE esta escala:\n- **Nota 0**: Perfeito! Código limpo, correto e pronto para ser aprovado.\n- **Nota 1 ou 2**: Muito bom! Apenas pequenos detalhes de estilo ou PEP 8. Está aprovado, não precisa alterar nada.\n- **Nota 3 ou 4**: Erros importantes de lógica ou comportamento. É recomendável corrigir esses pontos antes de aprovar.\n- **Nota 5**: Código com problemas críticos ou muito confuso. Precisa ajustar e refazer tudo.'
                  },
                  {
                    role: 'user',
                    content: `Aqui estão os dados do Pull Request para análise:\n\n### Mensagens de Commit enviadas:\n\`\`\`\n${commits}\n\`\`\`\n\n### Git Diff do Código:\n\`\`\`diff\n${diff}\n\`\`\``
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
          pr_number: ${{ github.event.issue.number }}
