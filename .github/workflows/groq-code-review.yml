name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')
    
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Commits and Isolated Diffs
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_REF="${{ github.base_ref }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
            BASE_REF=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi
          
          echo "Comparando contra a branch base: $BASE_REF"
          git fetch origin $BASE_REF
          
          echo "=== INÍCIO DO HISTÓRICO DE COMMITS ===" > pr_structured_history.txt
          
          COMMIT_HASHES=$(git log origin/$BASE_REF..HEAD --reverse --format="%H")
          
          if [ -z "$COMMIT_HASHES" ]; then
            echo "Nenhum commit detectado."
            exit 0
          fi
          
          for hash in $COMMIT_HASHES; do
            echo "----------------------------------------" >> pr_structured_history.txt
            echo "📌 HASH_COMMIT: $hash" >> pr_structured_history.txt
            echo "📝 MENSAGEM: $(git log -1 --format="%s" $hash)" >> pr_structured_history.txt
            echo "💻 ALTERAÇÕES DESTE COMMIT:" >> pr_structured_history.txt
            git show --format="" --patch $hash >> pr_structured_history.txt
            echo "----------------------------------------" >> pr_structured_history.txt
          done
          
          echo "=== FIM DO HISTÓRICO ===" >> pr_structured_history.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            if (!fs.existsSync('pr_structured_history.txt')) return;
            const history = fs.readFileSync('pr_structured_history.txt', 'utf8');

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                  {
                    role: 'system',
                    content: 'Análise de código focada em mentoria empática e ultra-específica para Gabriel, Lucas e Thais.\n\nREGRAS DE CONTEÚDO:\n1. NÃO misture os commits. Analise cada um separadamente na ordem enviada.\n2. Para novos conceitos, use apenas dicas curtas entre parênteses, ex: "(Poderia usar um dicionário aqui)". Não mude a estrutura do código além disso.\n3. Seja direto e evite enrolações teóricas.\n\nESCALA DE NOTAS VALIDA (0 a 5):\n- Nota 0: Perfeito/Aprovado (sem retoques).\n- Nota 1 ou 2: Muito Bom/Aprovado (detalhes bobos de formatação ou estilo, não mudam a lógica).\n- Nota 3 ou 4: Erros Importantes (lógica confusa ou comportamento errado que você recomenda ajustar antes do merge).\n- Nota 5: Crítico (código quebrou ou está completamente fora do proposto).\n\nESTRUTURA OBRIGATÓRIA DA RESPOSTA (Siga estritamente, em Markdown pt-BR):\n\nPara CADA commit:\n\n### 📌 Commit: `[Mensagem Original]`\n- **Mensagem de Commit:** (Avalie brevemente o Conventional Commits).\n- **Análise do Código:**\n  - **Onde:** Linha, variável ou arquivo afetado.\n  - **Feedback:** O que melhorar e o motivo.\n  - **Como ficaria:** Trecho pequeno modificado.\n- **Nota do Commit e Significado Prático:** [Nota de 0 a 5] - [Explique de forma muito clara e customizada o que essa nota significa para este código específico. Justifique o critério e explique se o erro é bobo ou se realmente impacta o funcionamento].\n\n---\n\n### 📊 Veredito Geral do Pull Request\n- **Status Final:** (Aprovado / Reprovado para Merge)\n- **Nota Geral do PR:** [Média de 0 a 5] - [Resumo rápido do critério final]'
                  },
                  {
                    role: 'user',
                    content: `Aqui estão os commits e os respectivos códigos isolados enviados no Pull Request:\n\n${history}`
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
          pr_number: ${{ github.event.issue.number }}
