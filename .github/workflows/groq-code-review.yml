name: Groq Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# Força o runner do GitHub a executar todas as Actions internas diretamente no Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    # Só roda se for um evento de PR normal OU se for um comentário dentro de um PR contendo "/review"
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review')
    
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout Code (PR Event)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se for por comentário, precisamos de um passo extra para clonar a branch correta do PR
      - name: Checkout Code (Comment Event)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR Diff and Commits
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necessário para rodar comandos do GitHub CLI
        run: |
          # Descobre a branch de destino baseando-se no evento
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
          else
            # No evento de comentário, usa o CLI do GitHub para descobrir a branch base
            BASE_REF=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          fi
          
          echo "Comparando contra a branch base: $BASE_REF"
          git fetch origin $BASE_REF
          
          # Captura as alterações de código (Diff)
          git diff origin/$BASE_REF...HEAD > pr_diff.txt
          
          # Captura as mensagens de commit feitas nesta branch
          git log origin/$BASE_REF...HEAD --oneline > pr_commits.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "Nenhuma alteração de código detectada."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Groq Review Script
        id: groq_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > review.js
          const fs = require('fs');

          async function run() {
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff.trim()) return;

            // Lendo os commits capturados, se existirem
            const commits = fs.existsSync('pr_commits.txt') ? fs.readFileSync('pr_commits.txt', 'utf8') : 'Nenhum commit encontrado.';

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GROQ_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                  {
                    role: 'system',
                    content: 'Você é um desenvolvedor sênior atuando como um mentor de código extremamente empático, paciente e focado no ensino. Este é um repositório educacional da equipe composta por Gabriel (droppxr), Lucas (lucaspierreviera-web) e Thais (Hithatha), que estão aprendendo a programar do zero. Eles estão estudando exercícios do Curso em Vídeo e conceitos gerais de tecnologia.\n\nComo eles estão no início da jornada, erros bobos, esquecimentos ou pequenos deslizes vão acontecer frequentemente. Faça um review incrivelmente legal, humanizado, acolhedor e focado em crítica construtiva. NUNCA use um tom rude ou puramente punitivo. No entanto, NÃO DEIXE NENHUM DETALHE DE LADO: aponte cada pequena melhoria, formatação ou padrão, pois todos os detalhes são cruciais para que eles criem uma base sólida de aprendizado.\n\nSua revisão DEVE avaliar de forma muito didática:\n1. PADRÃO DE COMMITS: Avalie se seguiram as diretrizes do Conventional Commits (ex: feat:, fix:, docs:, style:, refactor:). Se houver algo fora do padrão, ensine com carinho como estruturar melhor.\n2. PEP 8 (Python): Avalie formatação, espaçamentos, linhas em branco e nomenclatura (snake_case), explicando a importância de manter o código limpo.\n3. LÓGICA E BOAS PRÁTICAS: Explique redundâncias (ex: prints excessivos) ou abordagens mais eficientes, ensinando sempre o "porquê" de cada sugestão. Explique se as funções estão bem feitas, etc... .\n\nFormate a resposta de maneira organizada por tópicos e estritamente em Markdown (pt-BR).'
                  },
                  {
                    role: 'user',
                    content: `Aqui estão os dados do Pull Request para análise:\n\n### Mensagens de Commit enviadas:\n\`\`\`\n${commits}\n\`\`\`\n\n### Git Diff do Código:\n\`\`\`diff\n${diff}\n\`\`\``
                  }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
              const reviewText = data.choices[0].message.content;
              fs.writeFileSync('review_result.md', reviewText);
            } else {
              console.error('Erro na resposta da API:', data);
              process.exit(1);
            }
          }
          run();
          EOF
          node review.js

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: success()
        with:
          filePath: 'review_result.md'
          pr_number: ${{ github.event.issue.number }}
